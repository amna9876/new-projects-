name: Bug report
description: Something does not work the way the documentation says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Security problems do not belong here**: see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Widget
        - Chat server
        - Agent (tools, prompt, guardrails)
        - Store API contract / contract tests
        - Adapters
        - Mock store
        - Demo storefront
        - Docs or tooling
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or a failing test. `pnpm demo:scripted` is a good place to reproduce without an API key.
      placeholder: |
        1. pnpm demo:scripted
        2. Open http://localhost:3100 and ...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      description: Only if the bug depends on the model. Never paste an API key.
      placeholder: scripted demo / anthropic + model id / ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit hash, Node version, pnpm version, operating system, browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove keys, session ids and personal data first.
